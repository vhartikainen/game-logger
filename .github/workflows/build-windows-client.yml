name: Build Windows client

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "client/**"
      - ".github/workflows/build-windows-client.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtimageformats
          cache: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: qmake
        working-directory: client/GameLogger
        run: qmake GameLogger.pro -spec win32-msvc "CONFIG+=release"

      - name: Build
        working-directory: client/GameLogger
        run: nmake release

      - name: Deploy Qt runtime
        working-directory: client/GameLogger
        run: windeployqt --release --dir dist release\GameLogger.exe

      - name: Stage package
        working-directory: client/GameLogger
        shell: pwsh
        run: Copy-Item release\GameLogger.exe dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameLogger-windows-x64
          path: client/GameLogger/dist

      - name: Package release zip
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: client/GameLogger
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath GameLogger-windows-x64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: client/GameLogger/GameLogger-windows-x64.zip
