services:
  db:
    image: mariadb:10.6
    container_name: gamelogger-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-gamelogger}
      MARIADB_USER: ${DB_USER:-gamelogger}
      MARIADB_PASSWORD: ${DB_PASSWORD:-gamelogger}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    volumes:
      - db-data:/var/lib/mysql
      - ./server/createTables.sql:/docker-entrypoint-initdb.d/01-createTables.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: ghcr.io/vhartikainen/game-logger-web:latest
    container_name: gamelogger-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-gamelogger}
      DB_USER: ${DB_USER:-gamelogger}
      DB_PASSWORD: ${DB_PASSWORD:-gamelogger}
    ports:
      - "${WEB_PORT:-8090}:80"

  duckdns:
    image: linuxserver/duckdns:latest
    container_name: gamelogger-duckdns
    restart: unless-stopped
    environment:
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN}
      TOKEN: ${DUCKDNS_TOKEN}
      TZ: Etc/UTC

volumes:
  db-data:
